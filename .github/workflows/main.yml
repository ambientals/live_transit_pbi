# Trigger-only pipeline: runs update_transit.py and commits the rolling CSV.
# Scheduling is external (cron-job.org -> workflow_dispatch). No internal cron.
name: transit-data-pipeline
on:
    workflow_dispatch:
        inputs:
            station:
                description: "Station name to track (default: Alexanderplatz)"
                required: false
                default: "Alexanderplatz"

jobs:
    update-csv:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - run: pip install -r requirements.txt

            - run: python scripts/update_transit.py "${{ inputs.station }}"

            - name: Commit and Push CSV
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add data/transit_history.csv || true
                  git diff --cached --quiet || git commit -m "update transit data $(date -u +%H:%M)"
                  git push
