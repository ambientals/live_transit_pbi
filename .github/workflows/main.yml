# Trigger-only pipeline: runs update_transit.py, which appends the rolling CSV
# and writes a run-log receipt (logs/runs.csv). Scheduling is external
# (cron-job.org -> workflow_dispatch). No internal cron.
name: transit-data-pipeline

on:
    workflow_dispatch:
        inputs:
            station:
                description: "Station name to track (default: Alexanderplatz)"
                required: false
                default: "Alexanderplatz"

# Prevent overlapping runs from racing to commit the CSV.
# If a run hangs or takes longer than 15 minutes, subsequent
# dispatches will queue up instead of failing on `git push`.
concurrency:
    group: transit-update
    cancel-in-progress: false

jobs:
    update-csv:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - run: pip install -r requirements.txt

            - name: Update transit data + write run log
              run: python scripts/update_transit.py "${{ inputs.station }}"

            - name: Commit and Push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add data/transit_history.csv logs/runs.csv || true
                  STATUS=$(tail -n 1 logs/runs.csv | awk -F';' '{print $4}')
                  if git diff --cached --quiet; then
                      echo "No changes to commit (status: $STATUS)."
                  else
                      git commit -m "transit update $(date -u +%H:%M) [$STATUS]"
                      git push
                  fi
